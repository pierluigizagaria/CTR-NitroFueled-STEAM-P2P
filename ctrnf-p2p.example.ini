; Relative paths are resolved beside the bridge executable, not the config file.
; Use forward slashes, or JSON quoted strings with escaped backslashes.
[platform]
provider = steam

[steam]
app_id = 480
library = steam_api64.dll

[player]
online_id =
unlock_all = false

[game]
host = native
profile = ctr
executable = /path/to/sacredfire.exe
game_dir = /path/to/owned/merged/game
prepared_dir = /path/to/upstream/prepared/output
patches_dir = /path/to/ctrnf-server-signature-patch
profile_dir = runtime/player
; runtime_dir = /path/to/retained/clang64/bin

[publisher]
executable = /path/to/demonware-server.exe
signing_key = /path/to/private/response-key.pem
; runtime_dir = /path/to/existing/openssl/bin
; Native upstream fabricates its token. This setting is weaker than a pipe token.
weak_admission = true

[session]
title = 5760
build = 01.21
realm = ctrnf-p2p

[network]
server = 127.0.0.2
http_port = 31380
auth_port = 8460
game_address = 127.0.0.1
game_port = 3074
