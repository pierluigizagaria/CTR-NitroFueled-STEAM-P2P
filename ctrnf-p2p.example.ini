; ctrnf-p2p.ini beside ctrnf-p2p.exe in the native port's root folder.
; Native game paths, saves and preferences stay in the port's own settings.
; Advanced settings: docs/CONFIGURATION.md (ctrnf-p2p-docs/ in the mod ZIP).

[platform]
provider = steam

[steam]
; 480 is Steam's public Spacewar test app. All players must use the same AppID.
app_id = 480

[game]
; The supported game: the GetLostIn native port.
host = native

[server]
; true makes the whole Pit Stop catalog available without spending coins.
; Purchases and progress are kept; players in either mode can race together.
unlock_all = false
