; ctrnf-p2p.ini beside ctrnf-p2p.exe in the native port's root folder.
; Native game paths, saves and preferences stay in the port's own settings.
; Advanced settings and their defaults are listed in docs/CONFIGURATION.md.

[platform]
provider = steam

[steam]
; The only AppID source; every peer uses the same licensed AppID.
app_id = 480

[game]
; Selects the bridge's host adapter, not a native setting.
host = native

[server]
; Forwarded to the local server. Normal and unlock-all share saves and database.
unlock_all = false
